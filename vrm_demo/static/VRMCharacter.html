<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1324" />
  <title>安心健康助手</title>
  <style>
    [hidden] { display: none !important; }
    :root {
      color-scheme: dark;
      --ink: #0b1324;
      --surface: #14213a;
      --surface-soft: #1b2a47;
      --line: #354666;
      --text: #f6f8fc;
      --muted: #bdc9dc;
      --blue: #5b8cff;
      --blue-dark: #2f6feb;
      --teal: #43c6b5;
      --amber: #f6b73c;
      --shadow: 0 18px 55px rgba(0, 0, 0, .28);
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--ink); }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 22% 12%, rgba(47, 111, 235, .22), transparent 32rem),
        linear-gradient(145deg, #0b1324 0%, #111e35 54%, #0a1528 100%);
      font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: 18px;
      line-height: 1.65;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, summary:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .app-shell { width: min(1500px, 100%); min-height: 100vh; margin: 0 auto; padding: 24px clamp(18px, 3vw, 48px) 32px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark {
      display: grid; place-items: center; width: 52px; height: 52px; border-radius: 17px;
      color: var(--ink); background: var(--teal); font-size: 26px; font-weight: 900;
      box-shadow: 0 8px 25px rgba(67, 198, 181, .23);
    }
    .brand h1 { margin: 0; font-size: clamp(22px, 3vw, 30px); line-height: 1.2; letter-spacing: .03em; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 15px; }
    .system-state { display: flex; align-items: center; gap: 9px; padding: 9px 14px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 15px; }
    .state-dot { width: 10px; height: 10px; flex: none; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 5px rgba(67, 198, 181, .12); }

    .workspace { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(420px, .92fr); gap: 24px; min-height: calc(100vh - 122px); }
    .panel { border: 1px solid var(--line); border-radius: 26px; background: rgba(20, 33, 58, .92); box-shadow: var(--shadow); overflow: hidden; }

    .avatar-panel { position: relative; min-height: 650px; isolation: isolate; }
    #stage { position: absolute; inset: 0; z-index: -1; }
    #stage canvas { display: block; width: 100%; height: 100%; }
    .avatar-panel::before {
      content: ""; position: absolute; inset: auto 7% 3% 7%; height: 30%; z-index: -1;
      background: radial-gradient(ellipse, rgba(47, 111, 235, .25), transparent 68%); pointer-events: none;
    }
    .avatar-copy { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 560px; padding: 36px; text-align: center; pointer-events: none; }
    .avatar-orbit {
      display: grid; place-items: center; width: 126px; height: 126px; margin-bottom: 26px;
      border: 1px solid rgba(91, 140, 255, .48); border-radius: 50%;
      background: radial-gradient(circle, rgba(91, 140, 255, .26), rgba(91, 140, 255, .04) 63%, transparent 64%);
      box-shadow: 0 0 0 20px rgba(91, 140, 255, .04), 0 0 70px rgba(91, 140, 255, .22);
      font-size: 48px;
    }
    .avatar-copy h2 { margin: 0 0 8px; font-size: clamp(25px, 3vw, 36px); }
    .avatar-copy p { max-width: 490px; margin: 0; color: var(--muted); }
    .capabilities { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 24px; }
    .capability { padding: 7px 13px; border: 1px solid var(--line); border-radius: 999px; color: #dbe7ff; background: rgba(11, 19, 36, .55); font-size: 15px; }

    .stage-status {
      position: absolute; left: 22px; right: 22px; bottom: 22px; display: flex; align-items: flex-start; gap: 12px;
      padding: 15px 17px; border: 1px solid var(--line); border-radius: 17px; background: rgba(11, 19, 36, .88); backdrop-filter: blur(10px);
    }
    .stage-status strong { display: block; font-size: 16px; }
    .stage-status span { color: var(--muted); font-size: 14px; }
    .status-icon { color: var(--teal); font-weight: 900; }

    .chat-panel { display: flex; min-height: 650px; flex-direction: column; }
    .chat-heading { padding: 23px 25px 18px; border-bottom: 1px solid var(--line); }
    .chat-heading h2 { margin: 0; font-size: 24px; }
    .chat-heading p { margin: 3px 0 0; color: var(--muted); font-size: 15px; }
    #messages { flex: 1; min-height: 245px; max-height: 42vh; overflow-y: auto; padding: 22px 24px 8px; display: flex; flex-direction: column; gap: 13px; }
    .msg { max-width: 88%; padding: 13px 16px; border-radius: 17px; line-height: 1.55; word-break: break-word; }
    .msg.user { align-self: flex-end; color: white; background: var(--blue-dark); border-bottom-right-radius: 5px; }
    .msg.ai { align-self: flex-start; color: var(--text); background: var(--surface-soft); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
    .msg-note { display: block; margin-top: 7px; color: var(--muted); font-size: 14px; }

    #quick-replies { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 24px; }
    .quick-btn, .secondary-btn {
      min-height: 48px; padding: 9px 16px; color: #e7efff; background: transparent;
      border: 1px solid #61779f; border-radius: 13px; cursor: pointer; transition: background .15s, border-color .15s;
    }
    .quick-btn:hover, .secondary-btn:hover { border-color: var(--blue); background: rgba(91, 140, 255, .12); }
    #interaction-status { min-height: 30px; padding: 0 24px 6px; color: var(--muted); font-size: 15px; }
    #interaction-status.listening { color: #91e7dc; }
    #interaction-status.warning { color: #ffd27a; }

    .composer { padding: 17px 24px 20px; border-top: 1px solid var(--line); background: rgba(11, 19, 36, .32); }
    #voice-btn {
      width: 100%; min-height: 64px; border: 0; border-radius: 17px; cursor: pointer;
      color: #071926; background: linear-gradient(135deg, #55d8c7, #77d6ff); font-size: 21px; font-weight: 800;
      box-shadow: 0 10px 30px rgba(67, 198, 181, .16); transition: transform .15s, filter .15s;
    }
    #voice-btn:hover { filter: brightness(1.06); }
    #voice-btn:active { transform: scale(.985); }
    #voice-btn.listening { color: #321d00; background: linear-gradient(135deg, #ffc65c, var(--amber)); }
    .voice-hint { margin: 8px 2px 13px; color: var(--muted); text-align: center; font-size: 14px; }
    .input-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    #text-input {
      min-width: 0; min-height: 54px; padding: 10px 15px; color: var(--text); background: #0e1930;
      border: 1px solid #53698f; border-radius: 14px;
    }
    #text-input::placeholder { color: #93a4bf; }
    #send-btn { min-width: 94px; min-height: 54px; padding: 8px 18px; color: white; background: var(--blue-dark); border: 0; border-radius: 14px; cursor: pointer; font-weight: 700; }
    #send-btn:disabled { cursor: wait; opacity: .6; }

    details { border-top: 1px solid var(--line); }
    summary { min-height: 54px; padding: 13px 25px; color: var(--muted); cursor: pointer; font-size: 15px; }
    .settings { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 24px 20px; }
    .settings-note { width: 100%; margin: 0; color: var(--muted); font-size: 14px; }
    input[type="file"] { display: none; }

    @media (max-width: 980px) {
      .workspace { grid-template-columns: 1fr; }
      .avatar-panel { min-height: 420px; }
      .avatar-copy { min-height: 330px; }
      .chat-panel { min-height: 680px; }
      #messages { max-height: none; }
    }
    @media (max-width: 560px) {
      body { font-size: 17px; }
      .app-shell { padding: 16px 12px 24px; }
      .topbar { align-items: flex-start; }
      .brand p, .system-state span { display: none; }
      .system-state { padding: 12px; }
      .panel { border-radius: 20px; }
      .avatar-panel { min-height: 360px; }
      .avatar-copy { min-height: 285px; padding: 24px; }
      .avatar-orbit { width: 94px; height: 94px; margin-bottom: 18px; font-size: 38px; }
      .stage-status { left: 14px; right: 14px; bottom: 14px; }
      .chat-heading, #messages, #quick-replies, .composer { padding-left: 17px; padding-right: 17px; }
      .input-row { grid-template-columns: 1fr; }
      #send-btn { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.js",
        "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.5.5/lib/three-vrm-animation.module.js",
        "three-vrm-lip-sync": "/static/js/lib/three-vrm-lip-sync.js",
        "wlipsync": "/static/js/lib/wlipsync.js"
      }
    }
  </script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">安</div>
        <div>
          <h1>安心健康助手</h1>
          <p>用说话的方式，轻松办理健康服务</p>
        </div>
      </div>
      <div class="system-state" title="本地演示服务状态">
        <i class="state-dot" aria-hidden="true"></i>
        <span id="system-state-text">正在检查服务</span>
      </div>
    </header>

    <div class="workspace">
      <section class="panel avatar-panel" aria-labelledby="avatar-title">
        <div id="stage" aria-hidden="true"></div>
        <div class="avatar-copy" id="avatar-placeholder">
          <div class="avatar-orbit" aria-hidden="true">✦</div>
          <h2 id="avatar-title">数字人形象正在准备中</h2>
          <p>最终 3D 模型还未完成也不影响体验。对话、语音和服务流程现在就可以使用。</p>
          <div class="capabilities" aria-label="已可体验功能">
            <span class="capability">健康查询</span>
            <span class="capability">预警确认</span>
            <span class="capability">服务预约</span>
          </div>
        </div>
        <div class="stage-status">
          <span class="status-icon" aria-hidden="true">●</span>
          <div>
            <strong id="model-status-title">无需模型也可演示</strong>
            <span id="model-status-detail">识别到的动作会在模型接入后自动同步</span>
          </div>
        </div>
      </section>

      <section class="panel chat-panel" aria-labelledby="chat-title">
        <div class="chat-heading">
          <h2 id="chat-title">请说出您的需要</h2>
          <p>例如：“我最近头晕”或“帮我预约门诊”</p>
        </div>
        <div id="messages" role="log" aria-live="polite" aria-relevant="additions"></div>
        <div id="quick-replies" aria-label="快捷选择"></div>
        <div id="interaction-status" role="status" aria-live="polite">可以按住下方按钮说话，也可以打字。</div>

        <div class="composer">
          <button id="voice-btn" type="button" aria-pressed="false">🎙 开始语音对话</button>
          <p class="voice-hint">点击后说话；浏览器不支持时仍可使用文字输入</p>
          <div class="input-row">
            <label for="text-input" class="visually-hidden">输入您的需求</label>
            <input id="text-input" type="text" autocomplete="off" maxlength="500" placeholder="输入您的需求" />
            <button id="send-btn" type="button">发送</button>
          </div>
        </div>

        <details>
          <summary>演示设置（3D 模型完成后使用）</summary>
          <div class="settings">
            <button class="secondary-btn" id="load-btn" type="button">选择 .vrm 模型</button>
            <button class="secondary-btn" id="wave-btn" type="button">测试挥手</button>
            <button class="secondary-btn" id="anim-btn" type="button">选择 .vrma 动作</button>
            <input type="file" id="vrm-file" accept=".vrm" />
            <input type="file" id="vrm-anim-file" accept=".vrma" />
            <p class="settings-note">这些文件均为可选项，不影响语音和业务流程演示。</p>
          </div>
        </details>
      </section>
    </div>
  </main>

  <style>.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }</style>
  <script type="module" src="./js/VRMCharacter.js"></script>
</body>
</html>
